<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>start.gg Multi-Event Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /*
    =====================================================
      🎨 GUIDE DES COULEURS — modifie ces variables
         pour changer l'apparence du menu
    =====================================================

      --bg-base       fond principal du popup
      --bg-section    fond des cards/sections
      --bg-input      fond du champ texte
      --bg-row        fond des lignes d'events
      --border        couleur des bordures
      --accent        couleur principale (boutons, accents)
                      → aussi à changer dans popup.js
                        pour accent-color des checkboxes
      --text          texte principal
      --text-dim      texte secondaire / labels
      --text-muted    texte très discret (footer, hints)

    Pour un thème clair par exemple :
      --bg-base: #f5f5f5;
      --bg-section: #ffffff;
      --text: #111;
      ... etc.
    =====================================================
    */
    :root {
      --bg-base:    #0d0d1c;
      --bg-section: #181830;
      --bg-input:   #181830;
      --bg-row:     #181830;
      --border:     #2e2e50;
      --accent:     #9F5AF4;
      --text:       #e0e0ee;
      --text-dim:   #7788aa;
      --text-muted: #445;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text);
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, color-mix(in srgb, var(--bg-section) 80%, #000), color-mix(in srgb, var(--bg-section) 60%, #300040));
      padding: 14px 16px;
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 13px; font-weight: 700; color: #fff; }
    header p  { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

    /* ── Toggle langue dans le header ── */
    .lang-toggle {
      margin-left: auto;
      display: flex;
      background: color-mix(in srgb, var(--bg-section) 60%, #000);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lang-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-dim);
      transition: background .15s, color .15s;
      flex: unset;
      border-radius: 0;
    }
    .lang-btn.active {
      background: var(--accent);
      color: var(--bg-base);
    }
    .lang-btn:not(.active):hover { background: rgba(255,255,255,.07); color: var(--text); }

    /* ── Sections ── */
    .section { padding: 14px 16px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }

    label.field-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 11px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-family: monospace;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .hint { margin-top: 5px; font-size: 10px; color: var(--text-muted); line-height: 1.5; }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .row-btns { display: flex; gap: 8px; margin-top: 10px; }

    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:active { transform: scale(.97); }

    #btnSave { background: var(--accent); color: var(--bg-base); }
    #btnSave:hover { opacity: .88; }
    #btnClear { background: color-mix(in srgb, var(--bg-section) 80%, #000); color: var(--text-dim); border: 1px solid var(--border); }
    #btnClear:hover { filter: brightness(1.2); }

    #status { margin-top: 8px; font-size: 11px; text-align: center; min-height: 15px; }
    .ok  { color: #4cba82; }
    .err { color: #e06060; }

    /* ── Events section ── */
    #eventsSection { display: none; }

    .events-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .events-header span { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }

    .toggle-all {
      font-size: 10px; color: var(--accent); background: none; border: none;
      cursor: pointer; padding: 0; font-weight: 600; flex: unset;
    }
    .toggle-all:hover { text-decoration: underline; }

    #eventsList {
      display: flex; flex-direction: column; gap: 5px;
      max-height: 220px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }

    .event-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 9px; background: var(--bg-row);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-radius: 8px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .event-row:hover { filter: brightness(1.15); }
    .event-row.active { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }

    .event-row input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
    }
    .event-game-img { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .event-game-placeholder {
      width: 22px; height: 22px; border-radius: 4px;
      background: color-mix(in srgb, var(--border) 60%, transparent);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0;
    }

    .event-info { flex: 1; min-width: 0; }
    .event-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-game { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #applyBtn { width: 100%; margin-top: 10px; background: var(--accent); color: var(--bg-base); padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    #applyBtn:hover { opacity: .88; }

    #noEvents { font-size: 11px; color: var(--text-muted); text-align: center; padding: 10px 0; }

    footer { display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">🎮</div>
  <div>
    <h1>Multi-Event Tracker</h1>
    <p>start.gg bracket extension</p>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn" id="btnFr">FR</button>
    <button class="lang-btn" id="btnEn">EN</button>
  </div>
</header>

<!-- Clé API -->
<div class="section">
  <label class="field-label" for="apiKey" data-i18n="apiKeyLabel"></label>
  <input type="text" id="apiKey" autocomplete="off" spellcheck="false" data-i18n-placeholder="apiKeyPlaceholder" />
  <p class="hint" data-i18n-html="apiKeyHint"></p>
  <div class="row-btns">
    <button id="btnSave" data-i18n="save"></button>
    <button id="btnClear" data-i18n="clear"></button>
  </div>
  <div id="status"></div>
</div>

<!-- Filtre events -->
<div class="section" id="eventsSection">
  <div class="events-header">
    <span data-i18n="eventsLabel"></span>
    <button class="toggle-all" id="toggleAll" data-i18n="checkAll"></button>
  </div>
  <div id="eventsList"></div>
  <div id="noEvents" style="display:none" data-i18n="noEvents"></div>
  <button id="applyBtn" data-i18n="apply"></button>
</div>

<footer data-i18n="footer"></footer>

<script src="popup.js"></script>
</body>
</html>
